[project]
name = "infor-beta"
version = "0.5.40"
description = "INFOR Financial Group internal Claude Code plugin — clean-break rebuild of infor-workflows."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
    "PyYAML>=6,<7",
    "python-pptx>=1,<2",
    "openpyxl>=3,<4",
    "pywin32>=308 ; sys_platform == 'win32'",
    # Unconditional: LibreOffice + pypdfium2 is the default slide renderer on
    # every platform, so Windows dev renders exactly the way Cowork/Linux prod
    # does. (Was `sys_platform != 'win32'` through v0.5.34, which is why a
    # production rendering bug could not be reproduced locally.)
    "pypdfium2>=4",
    # Pillow backs pypdfium2's `.to_pil()` and `_trim_white_margins`; it was an
    # undeclared dependency of the LibreOffice path until that path became the
    # default on every platform.
    "pillow>=10",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    # The Phase B contract renders through LibreOffice constantly and a
    # conversion costs seconds, so the suite is soffice-bound and is run
    # distributed by default (see `addopts`). `slide_render` gives each process
    # a private LibreOffice profile, which is what makes concurrent conversions
    # safe — sharing one profile fails about half of them.
    "pytest-xdist>=3,<4",
]

[tool.pytest.ini_options]
testpaths = ["infor-beta/scripts/tests"]
pythonpath = ["infor-beta/scripts"]
# The suite is LibreOffice-bound: the Phase B contract renders constantly and a
# conversion costs seconds, so it is distributed by default.
#
# Six workers, not `auto`. More stops helping and starts thrashing, because each
# worker pays its own fixed cost — one library-baseline render plus its
# attribution probe — on top of contending for the box. Measured on a 20-core
# dev machine, full suite, all green: `-n 6` 159s, `-n auto` (20 workers) 232s.
# Six is also modest enough to stay reasonable on a small CI box; override with
# `-n auto` / `-n 2` where that suits better, and `-n0` for a serial run when
# debugging a single test.
#
# `--dist loadgroup` distributes per test, except for tests placed in an
# xdist_group — `conftest.py` puts every Office-COM test in one, since those COM
# servers are per-user singletons and must not be driven from two workers at once.
addopts = "-n 6 --dist loadgroup"
markers = [
    # Spawns a real, visible Excel via COM. Skipped unless INFOR_EXCEL_COM_TESTS
    # is set — see the gate in infor-beta/scripts/tests/conftest.py.
    "excel_com: Excel-COM test; opt in with INFOR_EXCEL_COM_TESTS=1",
]
