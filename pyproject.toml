[project]
name = "infor-beta"
version = "0.4.2"
description = "INFOR Financial Group internal Claude Code plugin — clean-break rebuild of infor-workflows."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
    "PyYAML>=6,<7",
    "python-pptx>=1,<2",
    "openpyxl>=3,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7,<9",
]

[tool.pytest.ini_options]
testpaths = ["infor-beta/scripts/tests"]
pythonpath = ["infor-beta/scripts"]
