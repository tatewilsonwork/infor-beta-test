[project]
name = "infor-beta"
version = "0.5.34"
description = "INFOR Financial Group internal Claude Code plugin — clean-break rebuild of infor-workflows."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
    "PyYAML>=6,<7",
    "python-pptx>=1,<2",
    "openpyxl>=3,<4",
    "pywin32>=308 ; sys_platform == 'win32'",
    "pypdfium2>=4 ; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
]

[tool.pytest.ini_options]
testpaths = ["infor-beta/scripts/tests"]
pythonpath = ["infor-beta/scripts"]
