[project]
name = "infor-beta"
version = "0.5.39"
description = "INFOR Financial Group internal Claude Code plugin — clean-break rebuild of infor-workflows."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
    "PyYAML>=6,<7",
    "python-pptx>=1,<2",
    "openpyxl>=3,<4",
    "pywin32>=308 ; sys_platform == 'win32'",
    # Unconditional: LibreOffice + pypdfium2 is the default slide renderer on
    # every platform, so Windows dev renders exactly the way Cowork/Linux prod
    # does. (Was `sys_platform != 'win32'` through v0.5.34, which is why a
    # production rendering bug could not be reproduced locally.)
    "pypdfium2>=4",
    # Pillow backs pypdfium2's `.to_pil()` and `_trim_white_margins`; it was an
    # undeclared dependency of the LibreOffice path until that path became the
    # default on every platform.
    "pillow>=10",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
]

[tool.pytest.ini_options]
testpaths = ["infor-beta/scripts/tests"]
pythonpath = ["infor-beta/scripts"]
markers = [
    # Spawns a real, visible Excel via COM. Skipped unless INFOR_EXCEL_COM_TESTS
    # is set — see the gate in infor-beta/scripts/tests/conftest.py.
    "excel_com: Excel-COM test; opt in with INFOR_EXCEL_COM_TESTS=1",
]
