# Earnings-update plan — Phase 3 POC
#
# Decomposes the former monolithic earnings-update conductor stage into
# typed handoffs: SlidePlan -> EarningsUpdateContent -> .pptx, all cloned from
# the shared INFOR Slide Library. The LTM metrics workbook runs before the
# companion cap table so its LTM revenue / Adj. EBITDA totals feed the cap
# table's LTM valuation column (D47 / D48); both emit standalone workbooks.

deliverable_type: earnings-update
description: Quarterly earnings update deck + companion cap table via decomposed typed stages.

plan_inputs:
  - name: reporting_quarter
    type: str
    required: true
    description: Reporting quarter, e.g. "Q4 2025".
  - name: comparison_quarter
    type: str
    required: true
    description: Prior-year comparison quarter, e.g. "Q4 2024".
  - name: eeo_snip_path
    type: Path
    required: true
    description: Absolute path to the Bloomberg EEO screenshot (image file).

stages:
  - id: wireframe
    skill: earningsupdate-wireframe
    inputs:
      company: $deal.subject_company
      ticker: $deal.subject_company.ticker
      reporting_quarter: $plan_inputs.reporting_quarter
      comparison_quarter: $plan_inputs.comparison_quarter
    outputs:
      - name: slide_plan_path
        type: Path
        description: Absolute path to the typed SlidePlan JSON artefact.
    checkpoint: informational

  - id: content
    skill: earningsupdate-content
    inputs:
      company: $deal.subject_company
      ticker: $deal.subject_company.ticker
      reporting_quarter: $plan_inputs.reporting_quarter
      comparison_quarter: $plan_inputs.comparison_quarter
      eeo_snip_path: $plan_inputs.eeo_snip_path
      slide_plan_path: $stages.wireframe.slide_plan_path
    outputs:
      - name: content_bundle_path
        type: Path
        description: Absolute path to the typed EarningsUpdateContent JSON artefact.
    checkpoint: informational

  # LTM metrics run *before* the cap table so its LTM revenue / Adj. EBITDA
  # totals can flow into the cap table's LTM valuation column (D47 / D48).
  - id: ltm-metrics
    skill: ltm-metrics
    inputs:
      company: $deal.subject_company
      ticker: $deal.subject_company.ticker
      reporting_quarter: $plan_inputs.reporting_quarter
      comparison_quarter: $plan_inputs.comparison_quarter
      deal_workbook: $deal.deal_workbook
    outputs:
      - name: workbook_path
        type: Path
        description: Absolute path to the deal workbook, whose `ltm-metrics` tab this stage wrote (revenue overview + revenue/EBITDA bridges; feeds the overview slide pie).
      - name: ltm_revenue
        type: float
        description: LTM revenue total (millions, filing reporting currency) — fed to the cap table D47.
      - name: ltm_adj_ebitda
        type: float
        description: LTM Adj. EBITDA total (millions, filing reporting currency) — fed to the cap table D48.
    checkpoint: informational

  - id: captable
    skill: captable
    inputs:
      company: $deal.subject_company
      ticker: $deal.subject_company.ticker
      ltm_revenue: $stages.ltm-metrics.ltm_revenue
      ltm_adj_ebitda: $stages.ltm-metrics.ltm_adj_ebitda
      deal_workbook: $deal.deal_workbook
    outputs:
      - name: workbook_path
        type: Path
        description: Absolute path to the deal workbook, whose `captable` tab this stage wrote (with LTM revenue/EBITDA in D47/D48).
    checkpoint: informational

  - id: deck
    skill: deck-assembler
    inputs:
      slide_plan_path: $stages.wireframe.slide_plan_path
      content_bundle_path: $stages.content.content_bundle_path
      captable_workbook_path: $stages.captable.workbook_path
      template_name: INFOR Slide Library.pptx
      output_dir: $deal.deal_dir
    outputs:
      - name: deck_path
        type: Path
        description: Absolute path to the generated earnings update .pptx deck with the cap table inserted.
    # Pre-delivery gate: the assembled deck is built from untrusted external
    # inputs (filings, EEO snip, web data), so the analyst must approve it
    # before delivery. `deck` sits alone in its wave ahead of `deckcheck`, so
    # this gate genuinely holds the falsification pass behind it.
    checkpoint: required

  # Falsification pass (Phase G). Reads the rendered slide PNGs, the run's merged
  # provenance record (every stage's `provenance.json` fragment, figure -> filing
  # -> statement -> page) and the attached filings, and attempts to DISPROVE every
  # figure on the deck. Advisory: it surfaces a review at the wave boundary and
  # never gates — the plan's one `required` approval stays on `deck`.
  - id: deckcheck
    skill: deckcheck
    inputs:
      company: $deal.subject_company
      deck_path: $stages.deck.deck_path
      deal_dir: $deal.deal_dir
    outputs:
      - name: report_path
        type: Path
        description: The advisory deck-check report (markdown) under the deal's artefacts/.
      - name: provenance_path
        type: Path
        description: The run's consolidated provenance record, <run_dir>/provenance.json.
      - name: finding_count
        type: int
        description: Figures the pass could not confirm (contradicted + unsupported + unverifiable); 0 when every figure checked out.
    checkpoint: informational

