# Earnings-update plan — Phase 3 POC
#
# Decomposes the former monolithic earnings-update conductor stage into
# typed handoffs: SlidePlan -> EarningsUpdateContent -> .pptx, all cloned from
# the shared INFOR Slide Library. The LTM metrics workbook runs before the
# companion cap table so the cap table's LTM valuation column (D47 / D48) can
# link to its bridge totals; both write tabs of the deal's one workbook.

deliverable_type: earnings-update
description: Quarterly earnings update deck + companion cap table via decomposed typed stages.

plan_inputs:
  - name: reporting_quarter
    type: str
    required: true
    description: Reporting quarter, e.g. "Q4 2025".
  - name: comparison_quarter
    type: str
    required: true
    description: Prior-year comparison quarter, e.g. "Q4 2024".
  - name: eeo_snip_path
    type: Path
    required: true
    description: Absolute path to the Bloomberg EEO screenshot (image file).

stages:
  # A Phase F in-process transform — one call to
  # `build_earnings_update_slide_plan`, run by the driver. `skill:` still names the
  # classification's key (`stage_transforms.TRANSFORMS`), the only place the kind
  # is declared.
  - id: wireframe
    skill: earningsupdate-wireframe
    inputs:
      company: $deal.subject_company
      ticker: $deal.subject_company.ticker
      reporting_quarter: $plan_inputs.reporting_quarter
      comparison_quarter: $plan_inputs.comparison_quarter
    outputs:
      - name: slide_plan_path
        type: Path
        description: Absolute path to the typed SlidePlan JSON artefact.
    checkpoint: informational

  - id: content
    skill: earningsupdate-content
    inputs:
      company: $deal.subject_company
      ticker: $deal.subject_company.ticker
      reporting_quarter: $plan_inputs.reporting_quarter
      comparison_quarter: $plan_inputs.comparison_quarter
      eeo_snip_path: $plan_inputs.eeo_snip_path
      slide_plan_path: $stages.wireframe.slide_plan_path
    outputs:
      - name: content_bundle_path
        type: Path
        description: Absolute path to the typed EarningsUpdateContent JSON artefact.
    checkpoint: informational

  # LTM metrics run *before* the cap table so the cap table's LTM valuation
  # column (D47 / D48) can LINK to this tab's bridge totals — one copy of each
  # figure, so correcting a bridge moves the cap table with it.
  - id: ltm-metrics
    skill: ltm-metrics
    inputs:
      company: $deal.subject_company
      ticker: $deal.subject_company.ticker
      reporting_quarter: $plan_inputs.reporting_quarter
      comparison_quarter: $plan_inputs.comparison_quarter
      deal_workbook: $deal.deal_workbook
    outputs:
      - name: workbook_path
        type: Path
        description: Absolute path to the deal workbook, whose `ltm-metrics` tab this stage wrote (revenue overview + revenue/EBITDA bridges; feeds the overview slide pie).
      - name: ltm_revenue
        type: float
        description: LTM revenue total (millions, filing reporting currency) — the figure the cap table stage REPORTS and cross-checks; its D47 links to this tab's bridge total rather than storing the number.
      - name: ltm_adj_ebitda
        type: float
        description: LTM Adj. EBITDA total (millions, filing reporting currency) — the figure the cap table stage REPORTS and cross-checks; its D48 links to this tab's bridge total rather than storing the number.
    checkpoint: informational

  - id: captable
    skill: captable
    inputs:
      company: $deal.subject_company
      ticker: $deal.subject_company.ticker
      ltm_revenue: $stages.ltm-metrics.ltm_revenue
      ltm_adj_ebitda: $stages.ltm-metrics.ltm_adj_ebitda
      deal_workbook: $deal.deal_workbook
    outputs:
      - name: workbook_path
        type: Path
        description: Absolute path to the deal workbook, whose `captable` tab this stage wrote (D47/D48 linked to the `ltm-metrics` bridge totals, or the CapIQ fallback when that tab is absent).
    checkpoint: informational

  - id: deck
    skill: deck-assembler
    inputs:
      slide_plan_path: $stages.wireframe.slide_plan_path
      content_bundle_path: $stages.content.content_bundle_path
      captable_workbook_path: $stages.captable.workbook_path
      template_name: INFOR Slide Library.pptx
      # No `output_dir`: the deck goes to `<deal_dir>/artefacts/`, derived from the
      # inputs path by `stage_io`. The old input existed for a direct invocation
      # this stage no longer has.
    outputs:
      - name: deck_path
        type: Path
        description: Absolute path to the generated earnings update .pptx deck with the cap table inserted.
      - name: vision_review_path
        type: Path
        description: The written vision review — which slides to look at and why, plus every slide's render and each rasterised picture at native resolution. Geometry is already measured and repaired inside the assembler; this is the reading half.
    # No analyst gate (v0.5.49). The assembled deck is built from untrusted
    # external inputs (filings, EEO snip, web data), and everything that checks it
    # is automated and runs without asking the analyst anything: `deck_repair`
    # converges the geometry from measured renders inside the assembler,
    # `vision_review_path` is the reading half written to disk, and `deckcheck`
    # falsifies the figures downstream. The analyst reads all three after the run.
    #
    # A Phase F in-process transform: the driver assembles the deck itself rather
    # than dispatching a sub-agent to retype the call.
    checkpoint: informational

  # The read-the-slides pass, same as the pitch plan's and for the same reason: the
  # `deck` stage's `vision_review_path` is an agenda, and an agenda no stage
  # references is an output the plan believes it has. This plan has no chart stage,
  # so `deck` IS the final artefact and both inputs come from it. Advisory, never
  # gates, and it lands in the last wave beside `deckcheck` — same artefact, two
  # questions.
  - id: deckread
    skill: deckread
    inputs:
      company: $deal.subject_company
      deck_path: $stages.deck.deck_path
      vision_review_path: $stages.deck.vision_review_path
    outputs:
      - name: report_path
        type: Path
        description: The advisory read-the-slides review (markdown) under the deal's artefacts/.
      - name: finding_count
        type: int
        description: Things the reader saw and reported; 0 alongside a non-zero slides_read means every slide was read and nothing was found.
      - name: slides_read
        type: int
        description: How many slide renders were actually read. 0 means no renderer was available and the deck was NOT looked at — which is why it is declared separately from finding_count.
      - name: worklist_path
        type: Path
        description: The generated work list for the final artefact — which slides to look at and why, plus every render and each rasterised picture at native resolution.
    checkpoint: informational

  # Falsification pass (Phase G). Reads the rendered slide PNGs, the run's merged
  # provenance record (every stage's `provenance.json` fragment, figure -> filing
  # -> statement -> page) and the attached filings, and attempts to DISPROVE every
  # figure on the deck. Advisory: it surfaces a review at the wave boundary and
  # never gates — and since v0.5.49 no stage in this plan does.
  - id: deckcheck
    skill: deckcheck
    inputs:
      company: $deal.subject_company
      deck_path: $stages.deck.deck_path
      deal_dir: $deal.deal_dir
    outputs:
      - name: report_path
        type: Path
        description: The advisory deck-check report (markdown) under the deal's artefacts/.
      - name: provenance_path
        type: Path
        description: The run's consolidated provenance record, <run_dir>/provenance.json.
      - name: finding_count
        type: int
        description: Figures the pass could not confirm (contradicted + unsupported + unverifiable); 0 when every figure checked out.
    checkpoint: informational

