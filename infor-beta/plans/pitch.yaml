# Pitch plan — 14-slide INFOR slide-library deck
#
# Fills the canonical 14-slide INFOR Slide Library template end-to-end while
# preserving static credential/disclaimer/contact slides and deferring complex
# chart generation.

deliverable_type: pitch
description: 14-slide INFOR slide-library pitch deck.

plan_inputs:
  - name: client_name
    type: str
    required: true
    description: Client/company name to place on cover and company overview slide.
  - name: presentation_date
    type: str
    required: true
    description: Fully spelled-out month plus four-digit year, e.g. "April 2026".
  - name: analyst_notes
    type: str
    required: true
    description: Required analyst notes for executive summary, company overview, risks, and takeaway drafting.
  - name: reporting_quarter
    type: str
    required: true
    description: Reporting quarter for the LTM metrics bridge, e.g. "Q4 2025".
  - name: comparison_quarter
    type: str
    required: true
    description: Prior-year comparison quarter for the LTM metrics bridge, e.g. "Q4 2024".
  - name: section_labels
    type: list[str]
    required: false
    description: Optional section divider labels; wireframe infers defaults if omitted.
  - name: current_section
    type: str
    required: false
    description: Optional current section label to mark dark blue on divider slide.
  - name: market_entry_target_count
    type: int
    required: false
    description: Optional number of market-entry (acquisition) targets. When the analyst does not specify a count, the plugin defaults to 8 (4 slides, two targets per slide).
  - name: cim_path
    type: Path
    required: false
    description: Optional CIM / management presentation source path.
  - name: valuation_range
    type: str
    required: false
    description: Optional valuation range language for executive summary.
  - name: risk_notes
    type: str
    required: false
    description: Optional analyst risk notes to steer acquirer risks and mitigants.
  - name: comps_workbook_path
    type: Path
    required: false
    description: Optional existing comps workbook/chart artefact for insertion.

stages:
  - id: wireframe
    skill: pitch-wireframe
    inputs:
      company: $deal.subject_company
      client_name: $plan_inputs.client_name
      section_labels: $plan_inputs.section_labels
      current_section: $plan_inputs.current_section
      market_entry_target_count: $plan_inputs.market_entry_target_count
    outputs:
      - name: slide_plan_path
        type: Path
        description: Absolute path to the typed SlidePlan JSON artefact.
    checkpoint: informational

  - id: content
    skill: pitch-content
    inputs:
      company: $deal.subject_company
      client_name: $plan_inputs.client_name
      presentation_date: $plan_inputs.presentation_date
      analyst_notes: $plan_inputs.analyst_notes
      cim_path: $plan_inputs.cim_path
      valuation_range: $plan_inputs.valuation_range
      risk_notes: $plan_inputs.risk_notes
      slide_plan_path: $stages.wireframe.slide_plan_path
    outputs:
      - name: content_bundle_path
        type: Path
        description: Absolute path to the typed PitchDeckContent JSON artefact.
    checkpoint: informational

  # LTM metrics run *before* the cap table (mirrors the earnings-update plan) so
  # its LTM revenue / Adj. EBITDA totals flow into the cap table's LTM valuation
  # column (D47 / D48). Without this, the cap table falls back to CapIQ LTM
  # formulas that render empty / #NAME? in the slide-7 picture.
  - id: ltm-metrics
    skill: ltm-metrics
    inputs:
      company: $deal.subject_company
      ticker: $deal.subject_company.ticker
      reporting_quarter: $plan_inputs.reporting_quarter
      comparison_quarter: $plan_inputs.comparison_quarter
    outputs:
      - name: workbook_path
        type: Path
        description: Absolute path to the standalone LTM metrics .xlsx (revenue overview + revenue/EBITDA bridges; companion to the overview slide pie placeholder).
      - name: ltm_revenue
        type: float
        description: LTM revenue total (millions, filing reporting currency) — fed to the cap table D47.
      - name: ltm_adj_ebitda
        type: float
        description: LTM Adj. EBITDA total (millions, filing reporting currency) — fed to the cap table D48.
    checkpoint: informational

  - id: captable
    skill: captable
    inputs:
      company: $deal.subject_company
      ticker: $deal.subject_company.ticker
      ltm_revenue: $stages.ltm-metrics.ltm_revenue
      ltm_adj_ebitda: $stages.ltm-metrics.ltm_adj_ebitda
    outputs:
      - name: workbook_path
        type: Path
        description: Absolute path to the generated companion cap table .xlsx (with LTM revenue/EBITDA in D47/D48).
    checkpoint: informational

  # Insider ownership (Canadian public targets only). Runs *after* captable so
  # F35 (the % denominator) can be sourced from the cap table's basic shares.
  # Parses the analyst-attached SEDI "Insider Information by Issuer" PDF. When
  # the target is not a Canadian issuer or no SEDI PDF is attached, the stage
  # emits a null workbook_path and the deck-assembler leaves the ownership
  # slide's placeholders in place — the rest of the deck still assembles.
  - id: ownership
    skill: ownership
    inputs:
      company: $deal.subject_company
      ticker: $deal.subject_company.ticker
      captable_workbook_path: $stages.captable.workbook_path
    outputs:
      - name: workbook_path
        type: Path
        description: Absolute path to the ownership companion .xlsx (Select-Insiders block + F35); null when the target is not a Canadian issuer or no SEDI PDF was attached.
    checkpoint: informational

  - id: deck
    skill: deck-assembler
    inputs:
      slide_plan_path: $stages.wireframe.slide_plan_path
      content_bundle_path: $stages.content.content_bundle_path
      captable_workbook_path: $stages.captable.workbook_path
      ownership_workbook_path: $stages.ownership.workbook_path
      comps_workbook_path: $plan_inputs.comps_workbook_path
      template_name: INFOR Slide Library.pptx
      output_dir: $deal.deal_dir
    outputs:
      - name: deck_path
        type: Path
        description: Absolute path to the generated 14-slide POC .pptx deck.
    checkpoint: informational

  # Final consolidation: merge every companion workbook into one file named
  # pitch-<codename>.xlsx (one tab per producing skill) and delete the
  # individual sources. Runs last so the deck stage can still read the
  # standalone cap-table workbook before it is folded in. The optional comps
  # workbook is included when supplied; the aggregator skips it when absent.
  - id: workbook-aggregation
    skill: workbook-aggregator
    inputs:
      workbooks:
        captable: $stages.captable.workbook_path
        ltm-metrics: $stages.ltm-metrics.workbook_path
        ownership: $stages.ownership.workbook_path
        comps: $plan_inputs.comps_workbook_path
      deliverable_type: $deal.deliverable_type
      deal_name: $deal.codename
      output_dir: $deal.deal_dir
    outputs:
      - name: combined_workbook_path
        type: Path
        description: Absolute path to the combined workbook (one tab per producing skill); replaces the individual workbooks.
    checkpoint: informational
