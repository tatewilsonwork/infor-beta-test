# Pitch plan — INFOR slide-library deck (16-slide base, configurable slide mix)
#
# Fills the canonical INFOR Slide Library template end-to-end while preserving
# static credential/disclaimer/contact slides and deferring complex chart
# generation. Three deck-spec inputs adjust the slide mix: the market-entry
# (acquisition-target) slide count, the Financial Summary slide count (4 or 8
# metrics), and the optional Key Investment Highlights slide.

deliverable_type: pitch
description: INFOR slide-library pitch deck (16-slide base; configurable market-entry / Financial Summary / Key Investment Highlights slide mix).

plan_inputs:
  - name: client_name
    type: str
    required: true
    description: Client/company name to place on cover and company overview slide.
  - name: presentation_date
    type: str
    required: true
    description: Fully spelled-out month plus four-digit year, e.g. "April 2026".
  - name: analyst_notes
    type: str
    required: true
    description: Required analyst notes for executive summary, company overview, risks, and takeaway drafting.
  - name: reporting_quarter
    type: str
    required: true
    description: Reporting quarter for the LTM metrics bridge, e.g. "Q4 2025".
  - name: comparison_quarter
    type: str
    required: true
    description: Prior-year comparison quarter for the LTM metrics bridge, e.g. "Q4 2024".
  - name: section_labels
    type: list[str]
    required: false
    description: Optional section divider labels; wireframe infers defaults if omitted.
  - name: current_section
    type: str
    required: false
    description: Optional current section label to mark dark blue on divider slide.
  - name: market_entry_target_count
    type: int
    required: false
    description: Optional number of market-entry (acquisition) targets. When the analyst does not specify a count, the plugin defaults to 8 (4 slides, two targets per slide). Deck-spec item 7 answers in slides; targets = slides × 2.
  - name: financial_metric_count
    type: int
    required: false
    description: Optional Financial Summary metric count — 4 (default, one slide) or 8 (two slides, four tiles each). Deck-spec item 6 answers in slides; metrics = slides × 4.
  - name: include_investment_highlights
    type: bool
    required: false
    description: Optional Key Investment Highlights toggle — omitted/true keeps the slide; false drops it from the deck (deck-spec item 8 "omit").
  - name: cim_path
    type: Path
    required: false
    description: Optional CIM / management presentation source path.
  - name: valuation_range
    type: str
    required: false
    description: Optional valuation range language for executive summary.
  - name: risk_notes
    type: str
    required: false
    description: Optional analyst risk notes to steer acquirer risks and mitigants.

stages:
  - id: wireframe
    skill: pitch-wireframe
    inputs:
      company: $deal.subject_company
      client_name: $plan_inputs.client_name
      section_labels: $plan_inputs.section_labels
      current_section: $plan_inputs.current_section
      market_entry_target_count: $plan_inputs.market_entry_target_count
      financial_metric_count: $plan_inputs.financial_metric_count
      include_investment_highlights: $plan_inputs.include_investment_highlights
    outputs:
      - name: slide_plan_path
        type: Path
        description: Absolute path to the typed SlidePlan JSON artefact.
    checkpoint: informational

  - id: content
    skill: pitch-content
    inputs:
      company: $deal.subject_company
      client_name: $plan_inputs.client_name
      presentation_date: $plan_inputs.presentation_date
      analyst_notes: $plan_inputs.analyst_notes
      cim_path: $plan_inputs.cim_path
      valuation_range: $plan_inputs.valuation_range
      risk_notes: $plan_inputs.risk_notes
      include_investment_highlights: $plan_inputs.include_investment_highlights
      slide_plan_path: $stages.wireframe.slide_plan_path
    outputs:
      - name: content_bundle_path
        type: Path
        description: Absolute path to the typed PitchDeckContent JSON artefact.
    checkpoint: informational

  # Financial Summary data tab. Runs *before* `ltm-metrics` because it is the
  # single source of truth for the deck's financial metrics (four per Financial
  # Summary slide — 4 by default, 8 when the deck spec asks for two slides): it
  # selects them (industry-aware) and tells `ltm-metrics`, via
  # `ltm_bridge_specs`, which extra metrics to bridge LTM for. It gathers the
  # 5-fiscal-year history from the latest 10-Ks and links each metric's LTM cell
  # to the `ltm-metrics` tab (a label-keyed lookup that resolves only in the
  # sibling `ltm-metrics` tab). Independent of the ltm/captable chain — needs only the
  # target's facts + the attached 10-Ks.
  - id: financial-summary
    skill: financial-summary
    inputs:
      company: $deal.subject_company
      ticker: $deal.subject_company.ticker
      reporting_quarter: $plan_inputs.reporting_quarter
      comparison_quarter: $plan_inputs.comparison_quarter
      financial_metric_count: $plan_inputs.financial_metric_count
      deal_workbook: $deal.deal_workbook
    outputs:
      - name: workbook_path
        type: Path
        description: Absolute path to the deal workbook, whose `financial-summary` tab this stage wrote (5 FY + LTM × the requested metric count; chart-ready).
      - name: financial_metric_labels
        type: list[str]
        description: The Financial Summary metric names, in tile order (four per deck slide) — read by the deck stage for the FS slide tiles.
      - name: ltm_bridge_specs
        type: list
        description: Flow metrics (beyond revenue + Adj. EBITDA) that ltm-metrics must bridge so this tab can link each LTM cell.
    checkpoint: informational

  # LTM metrics run *before* the cap table (mirrors the earnings-update plan) so
  # its LTM revenue / Adj. EBITDA totals flow into the cap table's LTM valuation
  # column (D47 / D48). Without this, the cap table falls back to CapIQ LTM
  # formulas that render empty / #NAME? in the slide-7 picture. In the pitch plan
  # it also bridges the extra metrics named in `financial-summary`'s
  # `ltm_bridge_specs` so the Financial Summary tab can link their LTM totals.
  - id: ltm-metrics
    skill: ltm-metrics
    inputs:
      company: $deal.subject_company
      ticker: $deal.subject_company.ticker
      reporting_quarter: $plan_inputs.reporting_quarter
      comparison_quarter: $plan_inputs.comparison_quarter
      ltm_bridge_specs: $stages.financial-summary.ltm_bridge_specs
      deal_workbook: $deal.deal_workbook
    outputs:
      - name: workbook_path
        type: Path
        description: Absolute path to the deal workbook, whose `ltm-metrics` tab this stage wrote (revenue overview + revenue/EBITDA bridges; feeds the overview slide pie).
      - name: ltm_revenue
        type: float
        description: LTM revenue total (millions, filing reporting currency) — fed to the cap table D47.
      - name: ltm_adj_ebitda
        type: float
        description: LTM Adj. EBITDA total (millions, filing reporting currency) — fed to the cap table D48.
    checkpoint: informational

  - id: captable
    skill: captable
    inputs:
      company: $deal.subject_company
      ticker: $deal.subject_company.ticker
      ltm_revenue: $stages.ltm-metrics.ltm_revenue
      ltm_adj_ebitda: $stages.ltm-metrics.ltm_adj_ebitda
      deal_workbook: $deal.deal_workbook
    outputs:
      - name: workbook_path
        type: Path
        description: Absolute path to the deal workbook, whose `captable` tab this stage wrote (with LTM revenue/EBITDA in D47/D48).
    checkpoint: informational

  # Ownership (Canadian public targets only). Runs *after* captable so F35
  # (the % denominator) can be sourced from the cap table's basic shares.
  # Parses the analyst-attached SEDI "Insider Information by Issuer" PDF for
  # the insider side and, when a Bloomberg ownership export is also attached,
  # fills the institutional side too (Bloomberg Output tab + SEDI-duplicate
  # exclusion — the SEDI figure always wins). No Bloomberg export -> insider-
  # only workbook and the slide's Institutions side stays a placeholder. When
  # the target is not a Canadian issuer or no SEDI PDF is attached, the stage
  # emits a null workbook_path and the deck-assembler leaves the ownership
  # slide's placeholders in place — the rest of the deck still assembles.
  - id: ownership
    skill: ownership
    inputs:
      company: $deal.subject_company
      ticker: $deal.subject_company.ticker
      captable_workbook_path: $stages.captable.workbook_path
      deal_workbook: $deal.deal_workbook
    outputs:
      - name: workbook_path
        type: Path
        description: Absolute path to the deal workbook, whose `Ownership` (+ `Bloomberg Output`) tabs this stage wrote; null when the target is not a Canadian issuer or no SEDI PDF was attached, leaving the tabs as shipped.
    checkpoint: informational

  # Public comparables (trading comps). Independent of the ltm/captable/ownership
  # chain — it only needs the target's facts to pick the three verticals and
  # their public peers — so it runs after `ownership`, before `deck`. Capital IQ
  # cannot be refreshed in this environment, so the workbook ships with its CapIQ
  # array formulas un-evaluated (the analyst refreshes them in Excel) and the
  # deck's comps slide stays a placeholder.
  - id: comps
    skill: comps
    inputs:
      company: $deal.subject_company
      ticker: $deal.subject_company.ticker
      deal_workbook: $deal.deal_workbook
    outputs:
      - name: workbook_path
        type: Path
        description: Absolute path to the deal workbook, whose `comps` tab this stage wrote (3 verticals × 6 CapIQ tickers + descriptions; metric columns are CapIQ array formulas, un-evaluated until refreshed).
    checkpoint: informational

  # Precedent transactions. Like comps, it depends on nothing upstream — only the
  # target's facts, to pick the metric family (EV/Revenue+EV/EBITDA for operating
  # companies, P/E+P/B+P/TBV for financials) and the comparable deal set — so it
  # runs after `comps`, before `deck`. The column-C FX rate is a CapIQ array
  # formula, so the converted TEV / $-metric ratios / statistic rows stay
  # un-evaluated until the analyst refreshes Capital IQ in Excel (disclosed
  # multiples written into S–Z show immediately); the deck's precedents slide
  # stays a placeholder.
  - id: precedents
    skill: precedents
    inputs:
      company: $deal.subject_company
      ticker: $deal.subject_company.ticker
      deal_workbook: $deal.deal_workbook
    outputs:
      - name: workbook_path
        type: Path
        description: Absolute path to the deal workbook, whose `precedents` tab this stage wrote (≤2 groups × 6 M&A deals; disclosed multiples are literals, $-metric ratios + statistic rows are formulas, un-evaluated until refreshed).
    checkpoint: informational

  - id: deck
    skill: deck-assembler
    inputs:
      slide_plan_path: $stages.wireframe.slide_plan_path
      content_bundle_path: $stages.content.content_bundle_path
      captable_workbook_path: $stages.captable.workbook_path
      ownership_workbook_path: $stages.ownership.workbook_path
      financial_metric_labels: $stages.financial-summary.financial_metric_labels
      template_name: INFOR Slide Library.pptx
      output_dir: $deal.deal_dir
    outputs:
      - name: deck_path
        type: Path
        description: Absolute path to the generated .pptx deck (16-slide base, adjusted by the deck-spec slide mix).
    # Pre-delivery gate: the assembled deck is built from untrusted external
    # inputs (filings, exports, web data), so the analyst must approve it before
    # the final artefacts are produced. `deck` sits alone in its wave ahead of
    # `financial-charts`, so this wave-boundary gate genuinely holds the final
    # charted deck.
    checkpoint: required

  # Financial Summary charts: build the deck's metric charts (one per metric row
  # — four per Financial Summary slide) on the deal workbook's `financial-summary`
  # tab, then drop the rendered charts into each FS slide's four placeholders
  # (the slides are discovered by scanning the deck). It also builds the overview
  # slide's LTM revenue-by-segment pie on the `ltm-metrics` tab.
  #
  # Runs after `deck`, which it edits. It needs the `financial-summary` and
  # `ltm-metrics` tabs to exist, which is guaranteed transitively rather than by a
  # direct reference: `deck` depends on `financial-summary`, and on `captable`,
  # which depends on `ltm-metrics`. Before Phase D this stage also had to wait for
  # `workbook-aggregation`, because the `financial-summary` LTM link resolved only
  # in the combined workbook; the deal now owns one workbook from stage one, so
  # that constraint — and the aggregation stage — are gone.
  - id: financial-charts
    skill: financial-charts
    inputs:
      deal_workbook: $deal.deal_workbook
      deck_path: $stages.deck.deck_path
      deal_dir: $deal.deal_dir
    outputs:
      - name: deck_path
        type: Path
        description: The final pitch deck, with the Financial Summary charts inserted (same file, modified in place).
    checkpoint: informational
